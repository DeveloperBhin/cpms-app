name: TARI 
description: "TARI cashew production management system"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Camera
  camera: ^0.12.0+2

  # Image Picker
  image_picker: ^1.1.2

  # TensorFlow Lite
  tflite_flutter: ^0.12.1

  # Image Processing
  image: ^4.3.0

  # Path Utilities
  path: ^1.9.0

  # Permission Handling
  permission_handler: ^13.0.1

  # File Picker
  file_picker: 10.3.3

  # URL Launcher
  url_launcher: ^6.2.5

  # HTTP
  http: ^1.6.0

  # Local Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.4.2
  geolocator: ^13.0.0
  connectivity_plus: ^6.1.4
  google_maps_flutter: ^2.11.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"


# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  # Enable generated localization classes
  generate: true

  assets:
    - assets/model/
    - assets/data/
    - assets/images/
